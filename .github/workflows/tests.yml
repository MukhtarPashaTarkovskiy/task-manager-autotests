name: Task Manager test suites
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suites to run
        type: choice
        required: true
        default: Smoke
        options: [Smoke, Regression, All]
  push:
    branches: [develop]
env:
  TM_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
permissions:
  contents: read
# All suites use one test database/user: never overlap runs or matrix jobs.
concurrency:
  group: task-manager-test-environment
  cancel-in-progress: false
jobs:
  select:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - name: Select test suites
        id: suites
        shell: powershell
        env:
          SUITE_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'All' }}
        run: |
          if ($env:SUITE_SELECTION -notin @('Smoke','Regression','All')) { throw 'Invalid suite selection.' }
          $include = @()
          foreach ($kind in @('Smoke','Regression')) {
            if ($env:SUITE_SELECTION -eq 'All' -or $env:SUITE_SELECTION -eq $kind) {
              $include += @{ suite = "Api$kind"; module = 'api-tests' }
              $include += @{ suite = "Ui$kind"; module = 'ui-tests' }
            }
          }
          $matrix = @{ include = $include } | ConvertTo-Json -Depth 4 -Compress
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
  test:
    needs: select
    runs-on: windows-latest
    environment: test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
      TEST_DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_ALLOWED_DB_HOST: ${{ secrets.TEST_ALLOWED_DB_HOST }}
      TEST_ALLOWED_DB_PORT: ${{ vars.TEST_ALLOWED_DB_PORT }}
      TEST_BASE_URL: https://task-manager-test-588r.onrender.com
      HEADLESS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate test environment settings
        id: settings
        shell: powershell
        run: |
          $missing = $false
          foreach ($name in @('TEST_USER_PASSWORD','TEST_DB_URL','TEST_DB_USERNAME','TEST_DB_PASSWORD','TEST_ALLOWED_DB_HOST','TEST_ALLOWED_DB_PORT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Host "$name : MISSING"
              $missing = $true
            } else { Write-Host "$name : PRESENT" }
          }
          if ($missing) { throw 'Configure the missing Secrets and Variables in GitHub environment test.' }
          if ($env:TEST_BASE_URL -cne 'https://task-manager-test-588r.onrender.com') { throw 'Unapproved HTTP target.' }
          . ./scripts/Initialize-TestSecrets.ps1 -LibraryOnly
          try { Assert-TestDatabase $env:TEST_DB_URL $env:TEST_ALLOWED_DB_HOST $env:TEST_ALLOWED_DB_PORT }
          catch { throw 'TEST database validation failed: check approved host, port, database and TLS mode. Values suppressed.' }
          Write-Host 'PASS: approved test HTTP origin and JDBC settings; no network connection made.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Chrome is preinstalled on the GitHub-hosted Windows image.
      - name: Check Java, Maven and Chrome availability
        shell: powershell
        run: |
          Get-Command java.exe,mvn.cmd -ErrorAction Stop | Out-Null
          if (-not (Test-Path 'C:/Program Files/Google/Chrome/Application/chrome.exe')) {
            throw 'Chrome is unavailable on this runner.'
          }
          Write-Host 'PASS: Java, Maven and Chrome executables available; UI runs use headless mode.'
      - name: Wait for test Render cold start
        shell: powershell
        run: |
          $ready = $false
          $deadline = [DateTime]::UtcNow.AddMinutes(4)
          while ([DateTime]::UtcNow -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri "$env:TEST_BASE_URL/login" -UseBasicParsing -TimeoutSec 20 -MaximumRedirection 0
              if ($r.StatusCode -eq 200 -and $r.Content.Contains('id="username"') -and $r.Content.Contains('id="password"')) {
                $ready = $true
                break
              }
            } catch { Write-Host 'Test Render is warming up.' }
            Start-Sleep -Seconds 5
          }
          if (-not $ready) { throw 'Test Render did not become ready within four minutes.' }
      - name: Run ${{ matrix.suite }}
        id: run
        shell: powershell
        run: ./scripts/Invoke-TestMaven.ps1 -Suite ${{ matrix.suite }} -Headless -FromEnvironment -RunId $env:TM_RUN_ID
      - name: Audit textual results before upload
        id: audit
        if: always() && steps.settings.outcome == 'success' && steps.run.outcome != 'skipped'
        shell: powershell
        run: |
          if (Test-Path "test-runs/$env:TM_RUN_ID") {
            ./scripts/Test-ReportSecrets.ps1 -FromEnvironment -Paths "test-runs/$env:TM_RUN_ID"
          } else { throw 'No test results were produced; artifact upload refused.' }
      - name: Upload audited Allure results
        if: always() && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.suite }}
          path: test-runs/${{ env.TM_RUN_ID }}/
          if-no-files-found: error
          retention-days: 14
  reports:
    needs: test
    if: always() && needs.test.result != 'skipped' && needs.test.result != 'cancelled'
    runs-on: windows-latest
    environment: test
    timeout-minutes: 20
    env:
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
      TEST_DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_ALLOWED_DB_HOST: ${{ secrets.TEST_ALLOWED_DB_HOST }}
      TEST_ALLOWED_DB_PORT: ${{ vars.TEST_ALLOWED_DB_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: report-download
      - uses: actions/cache/restore@v4
        with:
          path: .allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-${{ github.ref_name }}-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Allure 2 CLI
        shell: powershell
        run: npm install --global allure-commandline@2.46.1
      - name: Assemble only this run and generate available reports
        id: generate
        shell: powershell
        run: |
          $run = "test-runs/$env:TM_RUN_ID"
          New-Item -ItemType Directory -Force -Path $run | Out-Null
          foreach ($artifact in Get-ChildItem report-download -Directory) {
            $id = Get-Content (Join-Path $artifact.FullName 'run.properties')
            if (-not ($id -contains "runId=$env:TM_RUN_ID")) { throw 'Artifact Run ID mismatch.' }
            if (-not (Test-Path "$run/run.properties")) { Copy-Item (Join-Path $artifact.FullName 'run.properties') "$run/run.properties" }
            foreach ($module in @('api-tests','ui-tests')) {
              $source = Join-Path $artifact.FullName $module
              if (Test-Path $source) {
                New-Item -ItemType Directory -Force -Path "$run/$module" | Out-Null
                foreach ($suite in Get-ChildItem $source -Directory) {
                  if (Test-Path "$run/$module/$($suite.Name)") { throw 'Duplicate module/suite artifact.' }
                  Copy-Item $suite.FullName "$run/$module/$($suite.Name)" -Recurse
                }
              }
            }
          }
          $failed = $false
          foreach ($kind in @('Smoke','Regression','All')) {
            foreach ($scope in @('api-tests','ui-tests','Combined')) {
              $modules = if ($scope -eq 'Combined') { @('api-tests','ui-tests') } else { @($scope) }
              $ready = $true
              foreach ($module in $modules) { if (-not (Test-Path "$run/$module/$kind/completed.marker")) { $ready=$false } }
              if (-not $ready) { continue }
              & ./scripts/Get-AllureReport.ps1 -RunId $env:TM_RUN_ID -Scope $scope -Kind $kind -HistoryRoot .allure-history -FromEnvironment
              if ($LASTEXITCODE -ne 0) { $failed=$true; continue }
              $html = Get-ChildItem "$run/reports/$scope-$kind" -Directory | Sort-Object Name -Descending | Select-Object -First 1
              $archive = ".allure-history/$env:TM_RUN_ID/$scope-$kind"
              New-Item -ItemType Directory -Path $archive | Out-Null
              Copy-Item "$($html.FullName)/html/history" "$archive/history" -Recurse
              Copy-Item "$($html.FullName)/html/report-manifest.json" "$archive/report-manifest.json"
              'audited' | Set-Content "$($html.FullName)/audited.marker"
            }
          }
          if ($failed) { throw 'Some reports failed to generate; audited reports will still be uploaded.' }
      - name: Collect audited reports only
        if: always()
        id: collect
        shell: powershell
        run: |
          $found = $false
          if (Test-Path "test-runs/$env:TM_RUN_ID/reports") {
            foreach ($marker in Get-ChildItem "test-runs/$env:TM_RUN_ID/reports" -Filter audited.marker -Recurse) {
              $name = $marker.Directory.Parent.Name + '-' + $marker.Directory.Name
              New-Item -ItemType Directory -Force published-reports | Out-Null
              Copy-Item "$($marker.Directory.FullName)/html" "published-reports/$name" -Recurse
              $found = $true
            }
          }
          "found=$($found.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        if: always() && steps.collect.outputs.found == 'true'
        with:
          name: allure-reports-${{ env.TM_RUN_ID }}
          path: published-reports/
          retention-days: 90
      - uses: actions/cache/save@v4
        if: always() && steps.collect.outputs.found == 'true'
        with:
          path: .allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
